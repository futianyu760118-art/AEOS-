name: Rebuild AEOS binary baseline documents

on:
  workflow_dispatch:
  push:
    paths:
      - 'staging/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f staging/READY
          test -d staging/base64/execution_plan
          test -d staging/base64/progress_workbook
          test -d staging/base64/development_manual
          test -d staging/base64/data_foundation
          test -n "$(find staging/base64/execution_plan -name 'part_*' -print -quit)"
          test -n "$(find staging/base64/progress_workbook -name 'part_*' -print -quit)"
          test -n "$(find staging/base64/development_manual -name 'part_*' -print -quit)"
          test -n "$(find staging/base64/data_foundation -name 'part_*' -print -quit)"

      - name: Rebuild files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat staging/base64/execution_plan/part_* | base64 -d > "docs/AEOS_V7.2_分模块分阶段具体执行方案_V1.0.docx"
          cat staging/base64/progress_workbook/part_* | base64 -d > "docs/AEOS_开发点检与进度表_V1.0.xlsx"
          cat staging/base64/development_manual/part_* | base64 -d > "docs/AEOS_项目开发执行手册_V1.0.docx"
          cat staging/base64/data_foundation/part_* | base64 -d > "docs/AEOS_企业数据与智能中台_Data_Foundation_总体方案_V0.2_AEOS_V7.2.docx"

      - name: Verify size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s "docs/AEOS_V7.2_分模块分阶段具体执行方案_V1.0.docx")" -eq 528704
          test "$(stat -c%s "docs/AEOS_项目开发执行手册_V1.0.docx")" -eq 48367
          test "$(stat -c%s "docs/AEOS_开发点检与进度表_V1.0.xlsx")" -eq 55114
          test "$(stat -c%s "docs/AEOS_企业数据与智能中台_Data_Foundation_总体方案_V0.2_AEOS_V7.2.docx")" -eq 1580452
          echo "77fce188fa7f5f8780c5324dc73a5a89afdb3a66bef79c9e9b0149fa7684d7b0  docs/AEOS_V7.2_分模块分阶段具体执行方案_V1.0.docx" | sha256sum -c -
          echo "9c93ad7b3b0a540506ae837f0d4381010b013abf7f46afa428014a5d6ba69535  docs/AEOS_项目开发执行手册_V1.0.docx" | sha256sum -c -
          echo "0bce8229ced21817a7e9e7588f897f4d6f5de5ac751e459aadd19627331150ec  docs/AEOS_开发点检与进度表_V1.0.xlsx" | sha256sum -c -
          echo "871b02246d07c4f0909aa613d3f6e68fc8b0fa72e1bd6f15ab885d703ccc128f  docs/AEOS_企业数据与智能中台_Data_Foundation_总体方案_V0.2_AEOS_V7.2.docx" | sha256sum -c -
          file docs/*

      - name: Commit rebuilt files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AEOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git rm -r staging/base64 staging/READY
          git commit -m "Build verified AEOS V7.2 baseline documents"
          git push
